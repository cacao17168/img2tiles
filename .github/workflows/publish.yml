name: Publish to Releases

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
            sudo apt-get update
            sudo apt-get install -y build-essential

      - name: Compile .a static library
        run: make libtest.a

      - name: Compile test framework with tests
        working-directory: ./third-party/caotests
        run: make test
